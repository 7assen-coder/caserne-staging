services:
  db:
    image: postgresql:16
    environment:
      - POSTGRES_DB=esp
      - POSTGRES_USER=esp
      - POSTGRES_PASSWORD=esp
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: "python manage.py 0.0.0.0:8080"
    volumes:
      - .:/code
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=esp
      - DB_USER=esp
      - DB_PASSWORD=esp
    depends_on:
      - db

volumes:
  pg_data:


services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=esp
      - POSTGRES_USER=esp
      - POSTGRES_PASSWORD=esp
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: "python manage.py runserver 0.0.0.0:8080"
    volumes:
      - ./backend:/code
    ports:
      - "8000:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=esp
      - DB_USER=esp
      - DB_PASSWORD=esp
    depends_on:
      - db

  frontend:
    build:
      context: ./ScolariteMilitaireFront
      dockerfile: Dockerfile
    ports:
      - "9081:80"
    depends_on:
      - backend

volumes:
  pg_data:


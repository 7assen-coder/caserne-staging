services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=esp
      - POSTGRES_USER=esp
      - POSTGRES_PASSWORD=esp
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Use Gunicorn WSGI server for production instead of Django's runserver
    command: "gunicorn backend.wsgi:application --bind 0.0.0.0:8080 --workers 3"
    volumes:
      - media_data:/code/media
    ports:
      - "8000:8080"
    environment:
      # Override at deploy: ALLOWED_HOSTS=<PUBLIC_IP>,localhost,127.0.0.1,backend
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-esp-demo-change-me-oracle-hassen-2026}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=esp
      - DB_USER=esp
      - DB_PASSWORD=esp
    depends_on:
      - db

  frontend:
    build:
      context: ./ScolariteMilitaireFront
      dockerfile: Dockerfile
    volumes:
      - media_data:/usr/share/nginx/media:ro
    ports:
      - "9081:80"
    depends_on:
      - backend

volumes:
  pg_data:
  media_data:

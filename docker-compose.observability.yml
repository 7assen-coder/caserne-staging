# Phase 32 — free observability on production VPS (no Kafka)
# Run alongside prod stack from /opt/polyspace/app:
#   docker compose -f docker-compose.observability.yml --env-file .env.obs up -d
#
# Mac dry-run: brew install --cask docker && docker compose -f docker-compose.observability.yml up -d
# Grafana: http://127.0.0.1:3000  Prometheus: http://127.0.0.1:9090  Kuma: http://127.0.0.1:3001
# Keep these bound to localhost; use SSH tunnel or Caddy basic-auth (status/grafana hosts).

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/polyspace/data/prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./deploy/observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - /opt/polyspace/data/loki:/loki
    ports:
      - "127.0.0.1:3100:3100"

  alloy:
    image: grafana/alloy:v1.7.1
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./deploy/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/polyspace/data/alloy:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3000}
    volumes:
      - /opt/polyspace/data/grafana:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    restart: unless-stopped
    volumes:
      - /opt/polyspace/data/uptime-kuma:/app/data
    ports:
      - "127.0.0.1:3001:3001"

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    # Shares Docker network `polyspace` with docker-compose.prod.yml
    ports:
      - "127.0.0.1:9121:9121"

networks:
  default:
    name: polyspace
    external: true

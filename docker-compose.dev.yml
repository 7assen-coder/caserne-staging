services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=esp
      - POSTGRES_USER=esp
      - POSTGRES_PASSWORD=esp
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: "python manage.py runserver 0.0.0.0:8080"
    volumes:
      - ./backend:/code:z
    ports:
      - "8000:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=esp
      - DB_USER=esp
      - DB_PASSWORD=esp
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.resend.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-resend}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-Polyspace <noreply@polyspace.mr>}
      - PLATFORM_NAME=${PLATFORM_NAME:-Polyspace}
      - CELERY_TASK_ALWAYS_EAGER=${CELERY_TASK_ALWAYS_EAGER:-False}
    depends_on:
      - db
      - redis

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: "celery -A backend worker -l info"
    volumes:
      - ./backend:/code:z
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=esp
      - DB_USER=esp
      - DB_PASSWORD=esp
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.resend.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-resend}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-Polyspace <noreply@polyspace.mr>}
      - PLATFORM_NAME=${PLATFORM_NAME:-Polyspace}
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./ScolariteMilitaireFront
      dockerfile: Dockerfile.dev
    ports:
      - "9081:9081"
    environment:
      - BACKEND_PROXY=http://backend:8080
    volumes:
      - ./ScolariteMilitaireFront:/app:z
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pg_data_dev:

name: Load staging (k6)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

jobs:
  k6-officers:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.STAGING_API_URL }}
      K6_EMAIL: ${{ secrets.K6_EMAIL }}
      K6_PASSWORD: ${{ secrets.K6_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Require secrets
        run: |
          if [ -z "$K6_EMAIL" ] || [ -z "$K6_PASSWORD" ]; then
            echo "Set repo secrets K6_EMAIL and K6_PASSWORD" >&2
            exit 1
          fi
          if [ -z "$BASE_URL" ]; then
            echo "BASE_URL=https://gesesp-api.onrender.com" >> "$GITHUB_ENV"
          fi
      - name: Wake staging
        run: |
          API="${BASE_URL:-https://gesesp-api.onrender.com}"
          curl -fsS --max-time 120 "${API%/}/api/healthz/" || true
          sleep 5
      - name: Run k6 officers-100
        uses: grafana/k6-action@v0.3.1
        with:
          filename: load/k6/officers-100.js
        env:
          BASE_URL: ${{ env.BASE_URL }}
          K6_EMAIL: ${{ env.K6_EMAIL }}
          K6_PASSWORD: ${{ env.K6_PASSWORD }}
      - name: Upload k6 summary if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-officers-100
          path: docs/load-reports/
          if-no-files-found: ignore

# GESESP staging blueprint (deploy mirror: 7assen-coder/caserne-staging)
# Public URLs: https://gesesp.com (UI) · https://api.gesesp.com (API)
# Until DNS: https://gesesp.onrender.com · https://gesesp-api.onrender.com
# Attach custom domains on Render, then set secret DB_* in the dashboard.

services:
  - type: web
    name: gesesp-api
    runtime: docker
    plan: free
    repo: https://github.com/7assen-coder/caserne-staging
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/docs/
    envVars:
      - key: DEBUG
        value: "False"
      - key: DB_SSLMODE
        value: require
      - key: DB_PORT
        value: "5432"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: api.gesesp.com,gesesp-api.onrender.com
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://gesesp.com,https://www.gesesp.com,https://gesesp.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://gesesp.com,https://www.gesesp.com,https://gesesp.onrender.com

  - type: web
    name: gesesp
    runtime: docker
    plan: free
    repo: https://github.com/7assen-coder/caserne-staging
    branch: main
    rootDir: ScolariteMilitaireFront
    dockerfilePath: ./Dockerfile
    envVars:
      - key: VITE_FRONTEND_ONLY
        value: "false"
      - key: VITE_USE_MOCK_ELEVES
        value: "false"
      - key: VITE_API_BASE_URL
        value: https://gesesp-api.onrender.com/api

# Polyspace staging blueprint (deploy mirror: 7assen-coder/caserne-staging)
# Staging: https://polyspace.onrender.com (UI) · https://polyspace-api-dlp4.onrender.com (API)
# Note: clean slug polyspace-api.onrender.com is held externally; live API uses -dlp4 until reclaimable.
# Transition aliases still allowed: gesesp.onrender.com · gesesp-api.onrender.com
# Production: https://polyspace.mr · https://api.polyspace.mr (VPS — not this blueprint)
# Attach custom domains on Render, then set secret DB_* / EMAIL_* in the dashboard.

services:
  - type: web
    name: polyspace-api
    runtime: docker
    plan: free
    repo: https://github.com/7assen-coder/caserne-staging
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz/
    envVars:
      - key: DJANGO_ENV
        value: staging
      - key: DEBUG
        value: "False"
      - key: SECURITY_HEADERS_ENABLED
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DB_SSLMODE
        value: require
      - key: DB_PORT
        value: "5432"
      - key: SECRET_KEY
        generateValue: true
      - key: PLATFORM_NAME
        value: Polyspace
      - key: ALLOWED_HOSTS
        value: polyspace-api-dlp4.onrender.com,polyspace-api.onrender.com,gesesp-api.onrender.com
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://polyspace.onrender.com,https://gesesp.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://polyspace.onrender.com,https://gesesp.onrender.com
      - key: JWT_COOKIE_SAMESITE
        value: "None"
      - key: JWT_COOKIE_SECURE
        value: "True"
      - key: LOGIN_MAX_FAILURES
        value: "5"
      - key: LOGIN_LOCKOUT_SECONDS
        value: "900"
      - key: DEFAULT_FROM_EMAIL
        value: Polyspace <noreply@polyspace.mr>
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: USE_LOCMEM_CACHE
        value: "True"
      - key: HEALTHZ_REQUIRE_REDIS
        value: "False"
      - key: HEALTHZ_REQUIRE_STORAGE
        value: "False"
      - key: CONN_MAX_AGE
        value: "60"
      - key: GUNICORN_WORKERS
        value: "2"
      - key: GUNICORN_THREADS
        value: "1"
      # Phase 24: stream without nginx X-Accel (Render). Phase 23: set USE_S3_MEDIA + AWS_* for R2 in dashboard.
      - key: MEDIA_DELIVERY
        value: stream
      - key: USE_S3_MEDIA
        value: "False"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0"

  - type: web
    name: polyspace
    runtime: docker
    plan: free
    repo: https://github.com/7assen-coder/caserne-staging
    branch: main
    rootDir: ScolariteMilitaireFront
    dockerfilePath: ./Dockerfile
    envVars:
      - key: VITE_FRONTEND_ONLY
        value: "false"
      - key: VITE_USE_MOCK_ELEVES
        value: "false"
      - key: VITE_APP_ENV
        value: staging
      - key: VITE_API_BASE_URL
        value: https://polyspace-api-dlp4.onrender.com/api/v1
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_TRACES_SAMPLE_RATE
        value: "0"

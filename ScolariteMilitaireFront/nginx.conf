# SPA-only nginx (Render / split hosting). API is called via absolute VITE_API_BASE_URL.
server {
    listen 80;
    server_name localhost;
    client_max_body_size 6M;

    location = /favicon.ico {
        alias /usr/share/nginx/html/esp-logo.png;
        default_type image/png;
        access_log off;
        expires 7d;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

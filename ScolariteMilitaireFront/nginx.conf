# ScolariteMilitaireFront/nginx.conf
server {
    listen 80;
    server_name localhost;

    client_max_body_size 6M;

    # Default browser probe /favicon.ico — must NOT fall through to SPA index.html
    location = /favicon.ico {
        alias /usr/share/nginx/html/esp-logo.png;
        default_type image/png;
        access_log off;
        expires 7d;
    }

    # Serve the React static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Django backend container
    location /api/ {
        # it's import to not add the trailling slash
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files (student documents): Django checks the JWT, then hands
    # the request back here via X-Accel-Redirect for nginx to stream.
    location /media/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal target of X-Accel-Redirect — not reachable directly by clients.
    location /protected-media/ {
        internal;
        alias /usr/share/nginx/media/;
    }
}
